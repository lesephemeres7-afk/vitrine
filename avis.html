<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Votre avis – Les Éphémères</title>
<meta name="description" content="Donnez votre avis sur la prestation des Éphémères.">
<meta property="og:title" content="Votre avis – Les Éphémères">
<meta property="og:description" content="Donnez votre avis sur la prestation des Éphémères.">
<meta name="theme-color" content="#060818">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
:root{--ink:#060818;--carte:rgba(255,255,255,.05);--ligne:rgba(255,255,255,.1);--txt:#F5F3FF;--doux:#A5A1C4;--or:#C084FC;--grad:linear-gradient(135deg,#A855F7,#6366F1);--gradtxt:linear-gradient(90deg,#F0ABFC,#C084FC,#818CF8)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Montserrat,system-ui,sans-serif;color:var(--txt);background:var(--ink);background-image:radial-gradient(90% 60% at 50% 0%,rgba(124,58,237,.35),transparent 70%);-webkit-font-smoothing:antialiased}
.hero{height:200px;background:var(--ink) center/cover no-repeat;position:relative}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(6,8,24,.25),var(--ink))}
.wrap{max-width:560px;margin:-90px auto 0;padding:0 16px 60px;position:relative;z-index:1}
.sur{font-size:11px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--or)}
h1{font-size:clamp(28px,7vw,38px);line-height:1.15;margin:10px 0 8px;font-weight:800}
h1 em{font-style:italic;font-weight:600;background:var(--gradtxt);-webkit-background-clip:text;background-clip:text;color:transparent}
.intro{color:var(--doux);line-height:1.6;margin:0 0 26px}
form,.merci{background:var(--carte);border:1px solid var(--ligne);border-radius:24px;padding:26px 22px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:600;color:#DDD6FE}
label.w{grid-column:1/-1}
input,textarea{font:inherit;font-size:16px;color:var(--txt);background:rgba(6,8,24,.55);border:1px solid var(--ligne);border-radius:14px;padding:13px 14px;outline:none;transition:border-color .2s,box-shadow .2s;width:100%}
input:focus,textarea:focus{border-color:#A855F7;box-shadow:0 0 0 4px rgba(168,85,247,.2)}
textarea{min-height:140px;resize:vertical;line-height:1.55}
input[type=date]{color-scheme:dark}
.stars{display:flex;gap:6px;margin-top:2px}
.stars button{all:unset;cursor:pointer;font-size:38px;line-height:1;color:rgba(251,191,36,.22);transition:transform .15s,color .15s}
.stars button.on{color:#FBBF24}
.stars button:hover{transform:scale(1.12)}
.stars button:focus-visible{outline:2px solid #A855F7;outline-offset:3px;border-radius:6px}
.lab-note{font-size:13px;font-weight:600;color:#DDD6FE;display:flex;justify-content:space-between;align-items:baseline}
.lab-note small{color:var(--doux);font-weight:500}
.env{margin-top:22px;width:100%;border:0;border-radius:999px;padding:16px;font:700 15px Montserrat,sans-serif;letter-spacing:.04em;color:#fff;background:var(--grad);box-shadow:0 10px 30px rgba(124,58,237,.4);cursor:pointer}
.env[disabled]{opacity:.6;cursor:wait}
.err{color:#FDA4AF;font-size:14px;margin:14px 0 0;min-height:1em}
.piege{position:absolute;left:-9999px}
.merci{text-align:center}
.merci .big{font-size:46px;margin-bottom:6px}
.merci h2{margin:4px 0 10px;font-size:24px}
.merci p{color:var(--doux);line-height:1.6;margin:0 0 18px}
.merci a{display:inline-block;color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px;background:var(--grad)}
@media (max-width:480px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="hero" id="hero"></div>
<main class="wrap" id="app"></main>

<script>
/* Les Éphémères — page publique hébergée sur GitHub Pages.
   Les contenus viennent de l'appli (Google Apps Script) : rien à modifier ici, tout se gère dans l'appli. */
var APPLI = 'https://script.google.com/macros/s/AKfycbyJsWPM9GAL2WCY8LR9jtJL93MwyKvdW-9LGNY0aE6XMZIvhbOODNQjGlAfGa28-Kg0/exec';
function appelAppli(fn, args) {
  var req = fn === 'clipVitrine'
    ? fetch(APPLI + '?api=clip&id=' + encodeURIComponent(args[0]), { credentials: 'omit' })
    : fetch(APPLI, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) });
  return req.then(function (r) { return r.json(); }).then(function (j) { if (!j.ok) throw new Error(j.err || 'Erreur'); return j.res; });
}
(function () {
  function mk(ok, ko) {
    return new Proxy({}, { get: function (_, k) {
      if (k === 'withSuccessHandler') return function (f) { return mk(f, ko); };
      if (k === 'withFailureHandler') return function (f) { return mk(ok, f); };
      return function () { appelAppli(k, [].slice.call(arguments)).then(function (r) { if (ok) ok(r); }, function (e) { if (ko) ko(e); }); };
    } });
  }
  window.google = { script: { run: mk() } };
})();
function lancer(api, idCible) {
  var cible = document.getElementById(idCible);
  if (cible) cible.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font:600 14px Montserrat,system-ui,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#C084FC"><span style="width:38px;height:38px;border-radius:50%;border:3px solid rgba(192,132,252,.25);border-top-color:#C084FC;animation:tourne .8s linear infinite"></span>Les Éphémères</div><style>@keyframes tourne{to{transform:rotate(360deg)}}</style>';
  fetch(APPLI + '?api=' + api, { credentials: 'omit' }).then(function (r) { return r.json(); }).then(function (j) {
    window.DATA = j && j.ok ? j.res : { nom: 'Les Éphémères', erreur: true };
  }).catch(function () { window.DATA = { nom: 'Les Éphémères', accroche: 'Page momentanément indisponible', erreur: true }; }).then(function () {
    if (cible) cible.innerHTML = '';
    var s = document.createElement('script'); s.text = document.getElementById('principal').textContent; document.body.appendChild(s);
  });
}
</script>
<script type="text/plain" id="principal">
(function () {
  var D = DATA || {}, note = 0;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  if (D.cover) document.getElementById('hero').style.backgroundImage = 'url("' + D.cover + '")';
  var app = document.getElementById('app');
  var mots = ['', 'Décevant', 'Moyen', 'Bien', 'Très bien', 'Exceptionnel !'];
  app.innerHTML = '<span class="sur">' + esc(D.nom) + '</span><h1>Votre <em>avis</em> compte</h1>'
    + '<p class="intro">Merci de nous avoir fait confiance ! Quelques mots sur notre prestation nous aident énormément.</p>'
    + '<form id="f" novalidate><div class="grid">'
    + '<label>Prénom *<input name="Prenom" autocomplete="given-name" required maxlength="60"></label>'
    + '<label>Nom<input name="Nom" autocomplete="family-name" maxlength="80"></label>'
    + '<label>Date de la prestation<input type="date" name="Date" max="' + esc(D.today) + '"></label>'
    + '<label>Lieu où vous nous avez vus<input name="Lieu" placeholder="Mariage à Valence, salle des fêtes…" maxlength="160"></label>'
    + '<div class="w" style="grid-column:1/-1"><div class="lab-note"><span>Votre note *</span><small id="mot">Touchez les étoiles</small></div><div class="stars" role="radiogroup" aria-label="Note sur 5">'
    + [1, 2, 3, 4, 5].map(function (i) { return '<button type="button" role="radio" aria-checked="false" aria-label="' + i + ' étoile' + (i > 1 ? 's' : '') + '" data-n="' + i + '">★</button>'; }).join('')
    + '</div></div>'
    + '<label class="w">Votre commentaire *<textarea name="Texte" maxlength="2000" required placeholder="Racontez-nous votre expérience…"></textarea></label>'
    + '<input class="piege" name="site" tabindex="-1" autocomplete="off" aria-hidden="true">'
    + '</div><p class="err" id="err" role="alert"></p><button class="env" id="env" type="submit">Envoyer mon avis</button></form>';
  var etoiles = app.querySelectorAll('.stars button');
  function peindre(n) { for (var i = 0; i < etoiles.length; i++) { etoiles[i].classList.toggle('on', i < n); } }
  for (var i = 0; i < etoiles.length; i++) {
    etoiles[i].addEventListener('click', function () { note = Number(this.getAttribute('data-n')); peindre(note); document.getElementById('err').textContent = ''; document.getElementById('mot').textContent = mots[note];
      for (var j = 0; j < etoiles.length; j++) etoiles[j].setAttribute('aria-checked', String(j + 1 === note)); });
    etoiles[i].addEventListener('mouseenter', function () { peindre(Number(this.getAttribute('data-n'))); });
    etoiles[i].addEventListener('mouseleave', function () { peindre(note); });
  }
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, err = document.getElementById('err'), b = document.getElementById('env'), d = { Note: note };
    for (var k = 0; k < f.elements.length; k++) { var el = f.elements[k]; if (el.name) d[el.name] = String(el.value || '').trim(); }
    if (!d.Prenom) { err.textContent = 'Indiquez votre prénom.'; return; }
    if (!note) { err.textContent = 'Choisissez une note en touchant les étoiles.'; return; }
    if (!d.Texte) { err.textContent = 'Écrivez quelques mots sur votre expérience.'; return; }
    err.textContent = ''; b.disabled = true; b.textContent = 'Envoi…';
    google.script.run.withSuccessHandler(function () {
      app.innerHTML = '<div class="merci"><div class="big">💜</div><h2>Merci ' + esc(d.Prenom) + ' !</h2><p>Votre avis a bien été envoyé. Il apparaîtra sur notre page après validation par le groupe.</p>'
        + (D.vitrine ? '<a href="' + esc(D.vitrine) + '" target="_top">Découvrir ' + esc(D.nom) + '</a>' : '') + '</div>';
      window.scrollTo(0, 0);
    }).withFailureHandler(function (x) { err.textContent = (x && x.message || String(x)).replace(/^Error:\s*/, ''); b.disabled = false; b.textContent = 'Envoyer mon avis'; }).envoyerAvis(d);
  });
})();
</script>
<script>lancer('avis', 'app');</script>
</body>
</html>
